name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laisse un déploiement en cours se terminer, mais ne garde qu'un seul run en attente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence de src/index.html
        run: test -f src/index.html || { echo "::error::src/index.html est introuvable, déploiement annulé."; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - id: deployment
        uses: actions/deploy-pages@v4
